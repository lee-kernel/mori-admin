name: mori-admin
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mori_admin
      POSTGRES_USER: mori_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 PostgreSQL 密码}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mori_admin", "-d", "mori_admin"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    build: ./api
    environment:
      ENVIRONMENT: production
      BACKEND_CORS_ORIGINS: ""
      SECRET_KEY: ${SECRET_KEY:?请在 .env 中设置随机密钥}
      POSTGRES_HOST: postgres
      POSTGRES_USER: mori_admin
      POSTGRES_DB: mori_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 PostgreSQL 密码}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:9394/healthz', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 15

  web:
    build: ./web
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
